<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f6ff">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="IDN CARE sedang menjalani maintenance singkat. Kami segera kembali.">
    <title>Segera Kembali — IDN CARE</title>
    <script>
      try {
        const savedThemePreference = JSON.parse(localStorage.getItem('idn-care-theme-settings') || 'null');
        const legacyTheme = localStorage.getItem('idn-care-theme');
        const savedMode = savedThemePreference?.mode;
        const themeMode = ['device', 'light', 'dark', 'scheduled'].includes(savedMode)
          ? savedMode
          : (legacyTheme === 'dark' || legacyTheme === 'light' ? legacyTheme : 'device');
        const toMinutes = (time, fallback) => /^([01]\d|2[0-3]):[0-5]\d$/.test(time || '') ? Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5)) : fallback;
        let dark = themeMode === 'dark';
        if (themeMode === 'device') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (themeMode === 'scheduled') {
          const start = toMinutes(savedThemePreference?.darkStart, 1080);
          const end = toMinutes(savedThemePreference?.lightStart, 360);
          const now = new Date();
          const current = now.getHours() * 60 + now.getMinutes();
          dark = start === end || (start < end ? current >= start && current < end : current >= start || current < end);
        }
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#101a2a');
        }
      } catch {}
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

      :root {
        color-scheme: light dark;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        color: #0a1f44;
        background: #f2f6ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --blue: #0b5fff;
        --cyan: #22d3ee;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 40px 24px; overflow-x: hidden; background: radial-gradient(ellipse at 78% 20%, #e3f6ff 0, transparent 32%), #f2f6ff; }
      .maintenance { width: min(100%, 1120px); padding: 30px 54px 25px; overflow: hidden; border: 1px solid rgb(255 255 255 / 80%); border-radius: 34px; background: rgb(255 255 255 / 88%); box-shadow: 0 28px 80px rgb(10 31 68 / 10%), 0 3px 12px rgb(10 31 68 / 5%); }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #0a1f44; font-size: 17px; font-weight: 700; letter-spacing: -.04em; }
      .brand strong { color: var(--blue); }
      .brand-mark { display: grid; width: 40px; aspect-ratio: 1; place-items: center; border-radius: 13px; color: white; background: linear-gradient(135deg, var(--blue), #1aa7e8); box-shadow: 0 7px 18px rgb(11 95 255 / 22%); }
      .brand-mark svg { width: 26px; }
      .message { display: grid; grid-template-columns: 1.02fr .98fr; align-items: center; gap: 30px; min-height: 490px; padding: 4px 0 0; }
      .message-copy { position: relative; z-index: 1; padding: 25px 0 30px; }
      .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin: 0 0 21px; padding: 9px 13px; border: 1px solid #dce9ff; border-radius: 999px; color: #31517c; background: #f5f9ff; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .status-dot { width: 8px; aspect-ratio: 1; border-radius: 50%; background: #18b978; box-shadow: 0 0 0 4px #dff8ed; }
      h1 { margin: 0; color: #0a1f44; font-size: clamp(38px, 5vw, 58px); line-height: 1.12; letter-spacing: -.055em; }
      h1 span { color: var(--blue); }
      .description { max-width: 445px; margin: 22px 0 0; color: #61728e; font-size: 15px; line-height: 1.85; }
      .coming-soon { display: flex; align-items: center; gap: 10px; margin: 23px 0 22px; color: #138abf; font-size: 11px; font-weight: 800; letter-spacing: .19em; }
      .coming-soon span { color: #20bdd9; font-size: 16px; }
      .cat-actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .wiggle-button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 9px; padding: 0 18px; border: 0; border-radius: 999px; color: white; background: linear-gradient(135deg, #0b5fff, #1aa7e8); box-shadow: 0 10px 20px rgb(11 95 255 / 20%); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: transform 180ms ease, box-shadow 180ms ease; }
      .feed-button { color: #0a1f44; background: #fff; box-shadow: inset 0 0 0 1px #d9e7fb; }
      .wiggle-button:hover { transform: translateY(-2px); box-shadow: 0 13px 25px rgb(11 95 255 / 28%); }
      .wiggle-button:active { transform: translateY(0) scale(.98); }
      .wiggle-button:focus-visible { outline: 3px solid #22d3ee; outline-offset: 4px; }
      .cat-scene { position: relative; display: grid; min-height: 370px; margin: 0; place-items: center; isolation: isolate; }
      .cat-scene::before { position: absolute; z-index: -1; width: min(90%, 360px); aspect-ratio: 1; border: 1px solid #e6f0ff; border-radius: 50%; background: radial-gradient(circle, #f0f8ff 0, #f7fbff 64%, transparent 65%); content: ''; }
      .cat { position: relative; z-index: 1; width: min(100%, 370px); overflow: visible; }
      .food-bowl { position: absolute; z-index: 2; right: 10%; bottom: 42px; display: grid; width: 68px; height: 48px; place-items: center; border-radius: 12px 12px 22px 22px; color: #fff; background: linear-gradient(180deg, #22d3ee 0 25%, #0b5fff 26%); box-shadow: 0 9px 16px rgb(10 31 68 / 15%); font-size: 22px; opacity: 0; scale: .7; }
      .food-bowl::before { position: absolute; top: -5px; width: 74px; height: 12px; border: 3px solid #0a1f44; border-radius: 50%; background: #fff; content: ''; }
      .food-bowl svg { position: relative; z-index: 1; width: 34px; height: 26px; }
      .cat-scene.is-fed .food-bowl { opacity: 1; scale: 1; }
      .fish-flight { position: absolute; z-index: 4; right: calc(10% + 17px); bottom: 86px; width: 38px; height: 30px; opacity: 0; pointer-events: none; }
      .fish-flight svg { width: 100%; height: 100%; overflow: visible; }
      .fish-body { fill: #ffbd59; stroke: #0a1f44; stroke-width: 2.5; stroke-linejoin: round; }
      .fish-detail { fill: none; stroke: #fff; stroke-linecap: round; stroke-width: 2; }
      .fish-eye { fill: #0a1f44; }
      .feed-heart { position: absolute; z-index: 3; top: 18%; right: 22%; color: #ff7794; font-size: 30px; opacity: 0; }
      .cat-shadow { fill: #d8e7fa; }
      .tail,.paw,.whiskers { fill: none; stroke: #0a1f44; stroke-linecap: round; stroke-linejoin: round; stroke-width: 6; }
      .body,.head { fill: #0b5fff; stroke: #0a1f44; stroke-linejoin: round; stroke-width: 5; }
      .body-mark { fill: none; stroke: #7dddf4; stroke-linecap: round; stroke-width: 8; }
      .inner-ear { fill: #ffb9bf; }
      .muzzle { fill: #fff; }
      .nose { fill: #ff8f9d; }
      .eye { fill: none; stroke: #0a1f44; stroke-linecap: round; stroke-width: 5; }
      .collar { fill: none; stroke: #22d3ee; stroke-linecap: round; stroke-width: 9; }
      .bell { fill: #ffd166; stroke: #fff; stroke-width: 2; }
      .orbit { position: absolute; border: 1px dashed #bfd7ff; border-radius: 50%; }
      .orbit-one { width: 330px; height: 230px; transform: rotate(-17deg); }
      .orbit-two { width: 270px; height: 340px; transform: rotate(24deg); }
      .spark { position: absolute; color: #20bdd9; }
      .spark-one { top: 42px; right: 55px; font-size: 30px; }
      .spark-two { bottom: 79px; left: 28px; color: #ffbd59; font-size: 39px; }
      figcaption { position: absolute; bottom: 3px; color: #72819a; font-size: 11px; text-align: center; }
      .footer { display: flex; align-items: center; justify-content: center; gap: 15px; color: #8290a7; font-size: 11px; }
      .footer p { margin: 0; }
      .footer p span { color: #f27b9b; }
      .footer-line { width: min(11vw, 90px); height: 1px; background: #e4ebf5; }
      .sr-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      .maintenance { position: relative; }
      .maintenance { position: relative; }
      .maintenance-theme-switch { position: absolute; z-index: 5; top: 22px; right: 25px; width: 78px; height: 42px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid #e1e7f0; border-radius: 999px; background: #f1f4f8; }
      .maintenance-theme-switch button { display: grid; place-items: center; padding: 0; border: 0; border-radius: 999px; color: #8792a3; background: transparent; cursor: pointer; transition: color .2s ease, background .2s ease, transform .2s ease; }
      .maintenance-theme-switch svg { width: 23px; height: 23px; }
      .maintenance-theme-switch button[aria-pressed="true"] { color: #111827; background: #dce3ee; }
      .maintenance-theme-switch button:active { transform: scale(.9); }
      .maintenance-theme-switch button:focus-visible { outline: 3px solid #0b5fff; outline-offset: 1px; }
      html[data-theme="dark"] { color-scheme: dark; color: #edf3ff; background: #101a2a; }
      html[data-theme="dark"] body { background: radial-gradient(ellipse at 78% 20%, #1c3046 0, transparent 34%), #101a2a; }
      html[data-theme="dark"] .maintenance { border-color: #30425d; background: rgb(23 35 54 / 94%); box-shadow: 0 28px 80px rgb(0 0 0 / 30%), 0 3px 12px rgb(0 0 0 / 18%); }
      html[data-theme="dark"] .brand { color: #edf3ff; }
      html[data-theme="dark"] .brand strong { color: #8db8ff; }
      html[data-theme="dark"] .eyebrow { border-color: #344862; color: #c2d1e5; background: #22334c; }
      html[data-theme="dark"] h1 { color: #f1f5fc; }
      html[data-theme="dark"] h1 span { color: #8db8ff; }
      html[data-theme="dark"] .description { color: #bdcadb; }
      html[data-theme="dark"] .coming-soon { color: #7fdcf1; }
      html[data-theme="dark"] .feed-button { color: #e5edf9; background: #24334a; box-shadow: inset 0 0 0 1px #40536f; }
      html[data-theme="dark"] .cat-scene::before { border-color: #344862; background: radial-gradient(circle, #243953 0, #1c2c43 64%, transparent 65%); }
      html[data-theme="dark"] .cat-shadow { fill: #0d1726; }
      html[data-theme="dark"] .orbit { border-color: #405776; }
      html[data-theme="dark"] figcaption { color: #a9b8cc; }
      html[data-theme="dark"] .footer { color: #a9b8cc; }
      html[data-theme="dark"] .footer-line { background: #344862; }
      html[data-theme="dark"] .maintenance-theme-switch { border-color: #080b16; background: #080b16; }
      html[data-theme="dark"] .maintenance-theme-switch button { color: #858da0; }
      html[data-theme="dark"] .maintenance-theme-switch button[aria-pressed="true"] { color: #f8faff; background: #29324f; }

      @media (prefers-reduced-motion: no-preference) {
        .cat.is-wiggling { animation: cat-wiggle 1.25s cubic-bezier(.36,.07,.19,.97) both; transform-origin: 52% 82%; }
        .cat.is-wiggling .tail { animation: tail-swish 1.25s ease-in-out both; transform-box: fill-box; transform-origin: 15% 80%; }
        .cat.is-wiggling .eye { animation: cat-blink 1.25s ease-in-out both; transform-box: fill-box; transform-origin: center; }
        .cat.is-eating { animation: cat-eat .95s ease-in-out both; transform-origin: 52% 82%; }
        .cat.is-eating .tail { animation: tail-swish .95s ease-in-out both; transform-box: fill-box; transform-origin: 15% 80%; }
        .cat.is-eating .eye { animation: cat-blink .95s ease-in-out both; transform-box: fill-box; transform-origin: center; }
        .cat.is-eating .mouth { animation: mouth-chew .4s .75s ease-in-out 2; transform-box: fill-box; transform-origin: center top; }
        .cat-scene.is-fed .food-bowl { animation: bowl-appear .35s ease-out forwards; }
        .cat-scene.is-fed .fish-flight { animation: fish-to-mouth .85s ease-in forwards; }
        .cat-scene.is-fed .feed-heart { animation: heart-pop .9s .35s ease-out both; }
        .message-copy { animation: arrive .6s ease-out both; }
        .cat-scene { animation: arrive .75s .12s ease-out both; }
      }

      @keyframes cat-wiggle { 0%,100% { rotate: 0deg; } 18% { rotate: -5deg; } 38% { rotate: 5deg; } 58% { rotate: -3deg; } 78% { rotate: 2deg; } }
      @keyframes tail-swish { 0%,100% { rotate: 0deg; } 30% { rotate: 17deg; } 65% { rotate: -13deg; } }
      @keyframes cat-blink { 0%,36%,52%,100% { scale: 1 1; } 43% { scale: 1 .12; } }
      @keyframes cat-eat { 0%,100% { rotate: 0deg; } 25% { translate: 0 8px; rotate: 3deg; } 50% { translate: 0 0; rotate: -2deg; } 75% { translate: 0 6px; rotate: 2deg; } }
      @keyframes fish-to-mouth { 0% { opacity: 1; translate: 0 0; rotate: 0deg; scale: 1; } 65% { opacity: 1; translate: -105px -108px; rotate: -18deg; scale: .85; } 100% { opacity: 0; translate: -112px -118px; rotate: -28deg; scale: .55; } }
      @keyframes mouth-chew { 0%,100% { scale: 1 .45; } 50% { scale: 1 1.5; } }
      @keyframes bowl-appear { from { opacity: 0; scale: .6; translate: 0 12px; } to { opacity: 1; scale: 1; translate: 0 0; } }
      @keyframes heart-pop { 0% { opacity: 0; scale: .4; translate: 0 10px; } 35% { opacity: 1; scale: 1.15; } 100% { opacity: 0; scale: 1; translate: 0 -28px; } }
      @keyframes arrive { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

      @media (max-width: 760px) {
        body { padding: 18px 14px; }
        .maintenance { padding: 23px 24px 20px; border-radius: 27px; }
        .message { grid-template-columns: 1fr; gap: 0; padding-top: 20px; }
        .message-copy { padding: 16px 0 0; }
        h1 { font-size: clamp(36px, 10vw, 52px); }
        .description { font-size: 14px; }
        .cat-scene { min-height: 300px; margin-top: -5px; }
        .cat { width: min(88%, 330px); }
        .orbit-one { width: 280px; height: 200px; }
        .orbit-two { width: 230px; height: 290px; }
        .spark-one { right: 8%; }
        .spark-two { left: 6%; }
        .footer { gap: 9px; }
      }

      @media (max-width: 380px) {
        .maintenance { padding-inline: 19px; }
        .cat-scene { min-height: 260px; }
        .footer { font-size: 10px; }
      }
    </style>
  </head>
  <body>

    <p class="sr-status" id="animation-status" aria-live="polite"></p>
    <script>
      const themeChoices = document.querySelectorAll('[data-theme-choice]');
      const syncThemeChoice = () => {
        const dark = document.documentElement.dataset.theme === 'dark';
        themeChoices.forEach((choice) => choice.setAttribute('aria-pressed', String(choice.dataset.themeChoice === (dark ? 'dark' : 'light'))));
      };
      themeChoices.forEach((choice) => choice.addEventListener('click', () => {
        const dark = choice.dataset.themeChoice === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#101a2a' : '#f2f6ff');
        try {
          const current = JSON.parse(localStorage.getItem('idn-care-theme-settings') || '{}');
          localStorage.setItem('idn-care-theme-settings', JSON.stringify({ ...current, mode: dark ? 'dark' : 'light', darkStart: current.darkStart || '18:00', lightStart: current.lightStart || '06:00' }));
          localStorage.setItem('idn-care-theme', dark ? 'dark' : 'light');
        } catch {}
        syncThemeChoice();
      }));
      syncThemeChoice();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
        try {
          const preference = JSON.parse(localStorage.getItem('idn-care-theme-settings') || '{}');
          if (preference.mode !== 'device') return;
          document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
          document.documentElement.style.colorScheme = event.matches ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', event.matches ? '#101a2a' : '#f2f6ff');
          syncThemeChoice();
        } catch {}
      });
      window.setInterval(() => {
        try {
          const preference = JSON.parse(localStorage.getItem('idn-care-theme-settings') || 'null');
          if (preference?.mode !== 'scheduled') return;
          const start = Number(preference.darkStart.slice(0, 2)) * 60 + Number(preference.darkStart.slice(3, 5));
          const end = Number(preference.lightStart.slice(0, 2)) * 60 + Number(preference.lightStart.slice(3, 5));
          const now = new Date();
          const current = now.getHours() * 60 + now.getMinutes();
          const dark = start === end || (start < end ? current >= start && current < end : current >= start || current < end);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#101a2a' : '#f2f6ff');
          syncThemeChoice();
        } catch {}
      }, 60_000);

      const cat = document.querySelector('#cat');
      const wiggleButton = document.querySelector('#wiggle-button');
      const feedButton = document.querySelector('#feed-button');
      const catScene = document.querySelector('.cat-scene');
      const animationStatus = document.querySelector('#animation-status');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');

      function wiggleCat() {
        if (motionPreference.matches) {
          animationStatus.textContent = 'Terima kasih! Teman IDN ikut menyambutmu.';
          return;
        }

        cat.classList.remove('is-wiggling');
        void cat.getBoundingClientRect();
        cat.classList.add('is-wiggling');
        animationStatus.textContent = 'Teman IDN sedang meliuk!';
      }

      function feedCat() {
        if (motionPreference.matches) {
          catScene.classList.add('is-fed');
          animationStatus.textContent = 'Nyam nyam! Terima kasih sudah memberi makan teman IDN.';
          return;
        }

        cat.classList.remove('is-eating');
        catScene.classList.remove('is-fed');
        void cat.getBoundingClientRect();
        cat.classList.add('is-eating');
        catScene.classList.add('is-fed');
        animationStatus.textContent = 'Nyam nyam! Si kucing sedang menikmati ikan.';
      }

      cat.addEventListener('animationend', (event) => {
        if (event.animationName === 'cat-wiggle') {
          cat.classList.remove('is-wiggling');
        }
      });

      wiggleButton.addEventListener('click', wiggleCat);
      feedButton.addEventListener('click', feedCat);

      if (!motionPreference.matches) {
        wiggleCat();
      }
    </script>
  </body>
</html>
