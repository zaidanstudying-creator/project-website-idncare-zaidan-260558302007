<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2f6ff">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="IDN CARE sedang menjalani maintenance singkat. Kami segera kembali.">
    <title>Segera Kembali — IDN CARE</title>
    <script>
      try {
        const savedThemePreference = JSON.parse(localStorage.getItem('idn-care-theme-settings') || 'null');
        const legacyTheme = localStorage.getItem('idn-care-theme');
        const savedMode = savedThemePreference?.mode;
        const themeMode = ['device', 'light', 'dark', 'scheduled'].includes(savedMode)
          ? savedMode
          : (legacyTheme === 'dark' || legacyTheme === 'light' ? legacyTheme : 'device');
        const toMinutes = (time, fallback) => /^([01]\d|2[0-3]):[0-5]\d$/.test(time || '') ? Number(time.slice(0, 2)) * 60 + Number(time.slice(3, 5)) : fallback;
        let dark = themeMode === 'dark';
        if (themeMode === 'device') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (themeMode === 'scheduled') {
          const start = toMinutes(savedThemePreference?.darkStart, 1080);
          const end = toMinutes(savedThemePreference?.lightStart, 360);
          const now = new Date();
          const current = now.getHours() * 60 + now.getMinutes();
          dark = start === end || (start < end ? current >= start && current < end : current >= start || current < end);
        }
        if (dark) {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.style.colorScheme = 'dark';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#101a2a');
        }
      } catch {}
    </script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
        color: #0a1f44;
        background: #f2f6ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --blue: #0b5fff;
        --cyan: #22d3ee;
      --amber: #f4b942;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 40px 24px; overflow-x: hidden; background: radial-gradient(ellipse at 78% 20%, #e3f6ff 0, transparent 32%), #f2f6ff; }
      .maintenance { width: min(100%, 1120px); padding: 30px 54px 25px; overflow: hidden; border: 1px solid rgb(255 255 255 / 80%); border-radius: 34px; background: rgb(255 255 255 / 88%); box-shadow: 0 28px 80px rgb(10 31 68 / 10%), 0 3px 12px rgb(10 31 68 / 5%); }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: #0a1f44; font-size: 17px; font-weight: 700; letter-spacing: -.04em; }
      .brand strong { color: var(--blue); }
      .brand-mark { display: grid; width: 40px; aspect-ratio: 1; place-items: center; border-radius: 13px; color: white; background: linear-gradient(135deg, var(--blue), #1aa7e8); box-shadow: 0 7px 18px rgb(11 95 255 / 22%); }
      .brand-mark svg { width: 26px; }
      .message { display: grid; grid-template-columns: 1.02fr .98fr; align-items: center; gap: 30px; padding: 10px 0 0; }
      .message-copy { position: relative; z-index: 1; padding: 16px 0 20px; }
      .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin: 0 0 21px; padding: 9px 13px; border: 1px solid #dce9ff; border-radius: 999px; color: #31517c; background: #f5f9ff; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .status-dot { width: 8px; aspect-ratio: 1; border-radius: 50%; background: #18b978; box-shadow: 0 0 0 4px #dff8ed; }
      h1 { margin: 0; color: #0a1f44; font-size: clamp(38px, 5vw, 58px); line-height: 1.12; letter-spacing: -.055em; }
      h1 span { color: var(--blue); }
      .description { max-width: 445px; margin: 22px 0 0; color: #61728e; font-size: 15px; line-height: 1.85; }
      .coming-soon { display: inline-flex; align-items: center; gap: 8px; margin: 12px 0 0; color: #138abf; font-size: 11px; font-weight: 800; letter-spacing: .18em; }
      .coming-soon-mark { color: #20bdd9; font-size: 14px; letter-spacing: 0; }
      .construction-scene { position: relative; display: grid; min-height: 370px; margin: 0; place-items: center; isolation: isolate; }
      .construction-scene::before { position: absolute; z-index: -1; width: min(94%, 420px); aspect-ratio: 1; border: 1px solid #e6f0ff; border-radius: 50%; background: radial-gradient(circle, #f0f8ff 0, #f7fbff 64%, transparent 65%); content: ''; }
      .construction-art { position: relative; z-index: 1; width: min(100%, 460px); overflow: visible; }
      .scene-shadow { fill: #d8e7fa; }
      .building-shell { fill: #dceaff; stroke: #0a1f44; stroke-width: 4; stroke-linejoin: round; }
      .building-side { fill: #c4d9f5; stroke: #0a1f44; stroke-width: 4; stroke-linejoin: round; }
      .building-floor { fill: none; stroke: #91add2; stroke-width: 3; }
      .building-window { fill: #fff; stroke: #7ca4dc; stroke-width: 2; }
      .building-window.is-lit { fill: #ffd166; }
      .scaffold { fill: none; stroke: #20bdd9; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .crane-structure { fill: none; stroke: #0b5fff; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .crane-detail { fill: none; stroke: #1aa7e8; stroke-width: 3; stroke-linecap: round; }
      .crane-cabin { fill: #22d3ee; stroke: #0a1f44; stroke-width: 3; }
      .crane-counterweight { fill: #ffbd59; stroke: #0a1f44; stroke-width: 3; }
      .crane-hook-line { fill: none; stroke: #0a1f44; stroke-width: 3; }
      .crane-load { transform-box: fill-box; transform-origin: center top; }
      .load-block { fill: #ffbd59; stroke: #0a1f44; stroke-width: 3; }
      .load-stripe { fill: none; stroke: #fff4d6; stroke-width: 4; }
      .site-skyline { fill: #e6edf7; }
      .site-ground { fill: none; stroke: #8aa0bd; stroke-width: 3; stroke-linecap: round; }
      .site-bush { fill: #32a878; }
      .site-barrier { fill: #f7f9fc; stroke: #24364e; stroke-width: 2; }
      .site-barrier-stripe { fill: none; stroke: #e64c4c; stroke-width: 5; stroke-dasharray: 9 6; }
      .site-cone { fill: #f1763d; stroke: #17324f; stroke-width: 2; stroke-linejoin: round; }
      .site-sign { fill: #f5c451; stroke: #17324f; stroke-width: 2; }
      .site-sign-mark { fill: none; stroke: #17324f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .vehicle-body { fill: var(--amber); stroke: #0a1f44; stroke-width: 3; stroke-linejoin: round; }
      .vehicle-trim { fill: #ef9f24; stroke: #0a1f44; stroke-width: 2.5; stroke-linejoin: round; }
      .vehicle-cabin { fill: #173d6d; stroke: #0a1f44; stroke-width: 3; stroke-linejoin: round; }
      .vehicle-glass { fill: #79d5ef; stroke: #d6f6ff; stroke-width: 2; }
      .vehicle-wheel { fill: #24364e; stroke: #0a1f44; stroke-width: 2.5; }
      .vehicle-hub { fill: #d8e8f6; stroke: #0a1f44; stroke-width: 2; }
      .vehicle-detail { fill: none; stroke: #0a1f44; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .vehicle { transform-box: fill-box; transform-origin: center bottom; }
      .vehicle-beacon { fill: #ff6b45; stroke: #fff5dc; stroke-width: 1.5; }
      .vehicle-signal { fill: none; stroke: #f4b942; stroke-width: 2.5; stroke-linecap: round; opacity: 0; }
      .vehicle-tread { fill: #25354b; stroke: #0a1f44; stroke-width: 2.5; }
      .vehicle-tread-mark { fill: none; stroke: #8aa0bd; stroke-width: 2; stroke-linecap: round; }
      .dozer-blade, .loader-boom { transform-box: fill-box; transform-origin: 0 50%; }
      .worker-body { fill: #0b5fff; stroke: #0a1f44; stroke-width: 2.5; stroke-linejoin: round; }
      .worker-vest { fill: var(--amber); }
      .worker-skin { fill: #d89468; stroke: #0a1f44; stroke-width: 1.8; }
      .worker-pants { fill: #263b58; stroke: #0a1f44; stroke-width: 2; stroke-linejoin: round; }
      .worker-helmet { fill: #f5c451; stroke: #0a1f44; stroke-width: 2; }
      .worker-walk { transform-box: fill-box; transform-origin: center bottom; }
      .worker-leg, .worker-arm { transform-box: fill-box; transform-origin: top center; }
      .worker-point-arm { transform-box: fill-box; transform-origin: 0 100%; }
      .worker-point-mark { fill: none; stroke: #22b8d2; stroke-width: 2; stroke-dasharray: 4 5; stroke-linecap: round; }
      .footer { display: flex; align-items: center; justify-content: center; gap: 15px; color: #8290a7; font-size: 11px; }
      .footer p { margin: 0; }
      .footer p span { color: #f27b9b; }
      .footer-line { width: min(11vw, 90px); height: 1px; background: #e4ebf5; }
      .sr-status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

      .maintenance { position: relative; }
      .maintenance-theme-switch { position: absolute; z-index: 5; top: 22px; right: 25px; width: 78px; height: 42px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border: 1px solid #e1e7f0; border-radius: 999px; background: #f1f4f8; }
      .maintenance-theme-switch button { display: grid; place-items: center; padding: 0; border: 0; border-radius: 999px; color: #8792a3; background: transparent; cursor: pointer; transition: color .2s ease, background .2s ease, transform .2s ease; }
      .maintenance-theme-switch svg { width: 23px; height: 23px; }
      .maintenance-theme-switch button[aria-pressed="true"] { color: #111827; background: #dce3ee; }
      .maintenance-theme-switch button:active { transform: scale(.9); }
      .maintenance-theme-switch button:focus-visible { outline: 3px solid #0b5fff; outline-offset: 1px; }
      html[data-theme="dark"] { color-scheme: dark; color: #edf3ff; background: #101a2a; }
      html[data-theme="dark"] body { background: radial-gradient(ellipse at 78% 20%, #1c3046 0, transparent 34%), #101a2a; }
      html[data-theme="dark"] .maintenance { border-color: #30425d; background: rgb(23 35 54 / 94%); box-shadow: 0 28px 80px rgb(0 0 0 / 30%), 0 3px 12px rgb(0 0 0 / 18%); }
      html[data-theme="dark"] .brand { color: #edf3ff; }
      html[data-theme="dark"] .brand strong { color: #8db8ff; }
      html[data-theme="dark"] .eyebrow { border-color: #344862; color: #c2d1e5; background: #22334c; }
      html[data-theme="dark"] h1 { color: #f1f5fc; }
      html[data-theme="dark"] h1 span { color: #8db8ff; }
      html[data-theme="dark"] .description { color: #bdcadb; }
      html[data-theme="dark"] .coming-soon { color: #7fdcf1; }
      html[data-theme="dark"] .construction-scene::before { border-color: #344862; background: radial-gradient(circle, #243953 0, #1c2c43 64%, transparent 65%); }
      html[data-theme="dark"] .scene-shadow { fill: #0d1726; }
      html[data-theme="dark"] .building-shell { fill: #2b405c; stroke: #9bb8df; }
      html[data-theme="dark"] .building-side { fill: #223650; stroke: #9bb8df; }
      html[data-theme="dark"] .building-floor { stroke: #6783a9; }
      html[data-theme="dark"] .building-window { fill: #203958; stroke: #88a9d4; }
      html[data-theme="dark"] .building-window.is-lit { fill: #ffd166; }
      html[data-theme="dark"] .crane-structure { stroke: #78a8ff; }
      html[data-theme="dark"] .crane-detail { stroke: #50d8ee; }
      html[data-theme="dark"] .crane-cabin { fill: #22d3ee; stroke: #10213b; }
      html[data-theme="dark"] .crane-counterweight,
      html[data-theme="dark"] .load-block { stroke: #10213b; }
      html[data-theme="dark"] .crane-hook-line { stroke: #c7d9f2; }
      html[data-theme="dark"] .site-skyline { fill: #202f44; }
      html[data-theme="dark"] .site-ground { stroke: #7187a5; }
      html[data-theme="dark"] .site-bush { fill: #246b5b; }
      html[data-theme="dark"] .site-barrier { fill: #e8edf6; stroke: #0a1f2f; }
      html[data-theme="dark"] .site-barrier-stripe { stroke: #d74242; }
      html[data-theme="dark"] .site-cone { stroke: #0a1f2f; }
      html[data-theme="dark"] .site-sign { stroke: #0a1f2f; }
      html[data-theme="dark"] .site-sign-mark { stroke: #0a1f2f; }
      html[data-theme="dark"] .vehicle-body { stroke: #0a1422; }
      html[data-theme="dark"] .vehicle-trim { stroke: #0a1422; }
      html[data-theme="dark"] .vehicle-cabin { fill: #244c78; stroke: #0a1422; }
      html[data-theme="dark"] .vehicle-glass { fill: #55b9d8; stroke: #d6f6ff; }
      html[data-theme="dark"] .vehicle-wheel,
      html[data-theme="dark"] .vehicle-tread { fill: #101a2a; stroke: #526b8b; }
      html[data-theme="dark"] .vehicle-hub { fill: #9ab4d2; stroke: #101a2a; }
      html[data-theme="dark"] .vehicle-detail { stroke: #172b45; }
      html[data-theme="dark"] .vehicle-tread-mark { stroke: #7187a5; }
      html[data-theme="dark"] .worker-body { stroke: #0a1422; }
      html[data-theme="dark"] .worker-pants { fill: #354d6b; stroke: #0a1422; }
      html[data-theme="dark"] .worker-skin { stroke: #0a1422; }
      html[data-theme="dark"] .worker-helmet { stroke: #0a1422; }
      html[data-theme="dark"] .worker-point-mark { stroke: #55d6e8; }
      html[data-theme="dark"] .footer { color: #a9b8cc; }
      html[data-theme="dark"] .footer-line { background: #344862; }
      html[data-theme="dark"] .maintenance-theme-switch { border-color: #080b16; background: #080b16; }
      html[data-theme="dark"] .maintenance-theme-switch button { color: #858da0; }
      html[data-theme="dark"] .maintenance-theme-switch button[aria-pressed="true"] { color: #f8faff; background: #29324f; }

      @media (prefers-reduced-motion: no-preference) {
        .vehicle-beacon { animation: beacon-flash .8s ease-in-out infinite alternate; }
        .vehicle-signal { animation: signal-flash 1.2s ease-out infinite; }
        .building-window.is-lit { animation: window-glow 3s ease-in-out infinite alternate; }
        .vehicle-left { animation: vehicle-left-pass 9s ease-in-out infinite alternate; }
        .vehicle-right { animation: vehicle-right-pass 11s ease-in-out infinite alternate; }
        .worker-walk { animation: worker-step 1.1s ease-in-out infinite alternate; }
        .worker-leg-a { animation: walk-leg 0.55s ease-in-out infinite alternate; }
        .worker-leg-b { animation: walk-leg 0.55s ease-in-out infinite alternate-reverse; }
        .worker-arm-a { animation: walk-arm 0.55s ease-in-out infinite alternate; }
        .worker-arm-b { animation: walk-arm 0.55s ease-in-out infinite alternate-reverse; }
        .worker-point-arm { animation: point-arm 2.2s ease-in-out infinite alternate; }
        .worker-point-mark { animation: point-pulse 1.4s ease-in-out infinite alternate; }
        .vehicle-wheel-spin { animation: wheel-turn 2.4s linear infinite; transform-box: fill-box; transform-origin: center; }
        .dozer-blade { animation: blade-work 2.2s ease-in-out infinite alternate; }
        .loader-boom { animation: boom-work 3s ease-in-out infinite alternate; }
        .message-copy { animation: arrive .6s ease-out both; }
        .construction-scene { animation: arrive .75s .12s ease-out both; }
      }

      @keyframes vehicle-left-pass { from { translate: 0 0; } to { translate: 18px 0; } }
      @keyframes vehicle-right-pass { from { translate: 0 0; } to { translate: -14px 0; } }
      @keyframes wheel-turn { to { rotate: 360deg; } }
      @keyframes blade-work { from { rotate: -2deg; } to { rotate: 4deg; } }
      @keyframes boom-work { from { rotate: -2deg; } to { rotate: 3deg; } }
      @keyframes worker-step { from { translate: -3px 0; } to { translate: 4px 0; } }
      @keyframes walk-leg { from { rotate: -13deg; } to { rotate: 13deg; } }
      @keyframes walk-arm { from { rotate: -17deg; } to { rotate: 17deg; } }
      @keyframes point-arm { from { rotate: -5deg; } to { rotate: 5deg; } }
      @keyframes point-pulse { from { opacity: .35; } to { opacity: 1; } }
      @keyframes beacon-flash { from { fill: #ff6b45; } to { fill: #fff1a6; } }
      @keyframes signal-flash { 0% { opacity: .85; scale: .7; } 100% { opacity: 0; scale: 1.5; } }
      @keyframes window-glow { from { opacity: .65; } to { opacity: 1; } }
      @keyframes arrive { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      }

      @media (max-width: 760px) {
        body { padding: 18px 14px; }
        .maintenance { padding: 23px 24px 20px; border-radius: 27px; }
        .message { grid-template-columns: 1fr; gap: 0; padding-top: 20px; }
        .message-copy { padding: 16px 0 0; }
        h1 { font-size: clamp(36px, 10vw, 52px); }
        .description { font-size: 14px; }
        .construction-scene { min-height: 300px; margin-top: -5px; }
        .construction-art { width: min(100%, 390px); }
        .footer { gap: 9px; }
        figcaption { max-width: 320px; margin-inline: auto; }
      }

      @media (max-width: 380px) {
        .maintenance { padding-inline: 19px; }
        .construction-scene { min-height: 260px; }
        .footer { font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <main class="maintenance" aria-labelledby="page-title">
      <div class="maintenance-theme-switch" role="group" aria-label="Pilih tema">
        <button type="button" data-theme-choice="light" aria-label="Mode terang" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
        <button type="button" data-theme-choice="dark" aria-label="Mode gelap" aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 15.4A8.5 8.5 0 0 1 8.6 3.6 8.5 8.5 0 1 0 20.4 15.4Z"/></svg></button>
      </div>
      <header class="brand" aria-label="IDN CARE">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M6 8.5c4.2-.9 7.5-.3 10 1.8 2.5-2.1 5.8-2.7 10-1.8v15c-4.2-.9-7.5-.3-10 1.8-2.5-2.1-5.8-2.7-10-1.8v-15Z" stroke="currentColor" stroke-width="2.3" stroke-linejoin="round"/>
            <path d="M16 10.5v14" stroke="currentColor" stroke-width="2.3"/>
          </svg>
        </span>
        <span>IDN <strong>CARE</strong></span>
      </header>

      <section class="message">
        <div class="message-copy">
          <p class="eyebrow"><span class="status-dot" aria-hidden="true"></span> Tim kami sedang bekerja</p>
          <h1 id="page-title">Waduh, maaf ya!<br><span>Situs sedang dibangun.</span></h1>
          <p class="description">Kami sedang memperbarui IDN CARE agar layanan segera kembali dengan pengalaman yang lebih baik. Terima kasih sudah menunggu.</p>
          <p class="coming-soon"><span class="coming-soon-mark" aria-hidden="true">✦</span>COMING SOON<span class="coming-soon-mark" aria-hidden="true">✦</span></p>
        </div>

        <figure class="construction-scene" id="construction-scene" aria-label="Ilustrasi crane dan gedung yang sedang dibangun">
          <svg class="construction-art" viewBox="0 0 500 380" role="img" aria-labelledby="construction-title">
            <title id="construction-title">Crane mengangkat material di depan gedung yang sedang dibangun</title>
            <ellipse class="scene-shadow" cx="255" cy="326" rx="190" ry="20"/>

            <path class="site-skyline" d="M0 244h35v-39h21v24h28v-57h25v74h23v-33h29v31h55v-72h22v39h26v-91h27v41h28v-75h35v103h20v-36h35v91h40v-62h31v123H0z" opacity=".72"/>
            <path class="site-bush" d="M0 300c17-24 31-22 43-3 11-35 34-36 45-3 12-24 28-25 40-3 14-33 38-29 45 2 16-17 32-14 43 8v27H0Zm345 1c14-29 35-29 47-1 10-38 34-39 47-4 11-25 27-27 39-5 8-18 15-20 22-8v37H345z" opacity=".9"/>
            <path class="site-ground" d="M9 326h482"/>

            <path class="building-side" d="M363 159h32l20 18v126h-52Z"/>
            <path class="building-shell" d="M224 159h139v144H224z"/>
            <path class="building-floor" d="M224 207h139M224 255h139"/>
            <path class="building-window" d="M241 173h28v23h-28zM282 173h28v23h-28zM323 173h24v23h-24z"/>
            <path class="building-window is-lit" d="M241 221h28v23h-28z"/>
            <path class="building-window" d="M282 221h28v23h-28zM323 221h24v23h-24zM241 269h28v23h-28zM282 269h28v23h-28z"/>
            <path class="scaffold" d="M211 151v160m-11-145h171m-171 51h171m-171 51h171m-161-102 42 51m-42 0 42 51m126-102-42 51m42 0-42 51"/>
            <path class="scaffold" d="M217 311h187"/>

            <path class="crane-structure" d="M171 293V62M153 293h36M171 62h247M171 62 96 39M171 75 118 58"/>
            <path class="crane-detail" d="M171 62 150 75h42Zm0 22-18 13h36Zm0 22-18 13h36Zm0 22-18 13h36Zm0 22-18 13h36Zm0 22-18 13h36Zm0 22-18 13h36Zm0 22-18 13h36Zm0 22-18 13h36Z"/>
            <path class="crane-cabin" d="M182 106h29v35h-29z"/>
            <path class="crane-detail" d="M190 114h13v13h-13zM183 145h30"/>
            <path class="crane-counterweight" d="M92 38h39v25H92z"/>
            <path class="crane-detail" d="M238 62 258 43h24l-20 19m35 0 20-19h24l-20 19m35 0 20-19h24l-20 19"/>
            <g class="crane-hoist">
              <line class="crane-hook-line crane-cable" id="crane-cable" x1="336" y1="66" x2="336" y2="135"/>

    </main>
    <script>
      const themeChoices = document.querySelectorAll('[data-theme-choice]');
      const syncThemeChoice = () => {
        const dark = document.documentElement.dataset.theme === 'dark';
        themeChoices.forEach((choice) => choice.setAttribute('aria-pressed', String(choice.dataset.themeChoice === (dark ? 'dark' : 'light'))));
      };
      themeChoices.forEach((choice) => choice.addEventListener('click', () => {
        const dark = choice.dataset.themeChoice === 'dark';
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#101a2a' : '#f2f6ff');
        try {
          const current = JSON.parse(localStorage.getItem('idn-care-theme-settings') || '{}');
          localStorage.setItem('idn-care-theme-settings', JSON.stringify({ ...current, mode: dark ? 'dark' : 'light', darkStart: current.darkStart || '18:00', lightStart: current.lightStart || '06:00' }));
          localStorage.setItem('idn-care-theme', dark ? 'dark' : 'light');
        } catch {}
        syncThemeChoice();
      }));
      const craneCable = document.querySelector('#crane-cable');
      const craneLoad = document.querySelector('#crane-load');
      const reducedMotionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let craneAnimationFrame = null;
      let craneAnimationStart = null;
      const animateCrane = (timestamp) => {
        craneAnimationFrame = null;
        if (reducedMotionPreference.matches) {
          craneCable.setAttribute('y2', '135');
          craneLoad.removeAttribute('transform');
          craneAnimationStart = null;

          return;
        }

        craneAnimationStart ??= timestamp;
        const progress = ((timestamp - craneAnimationStart) % 7000) / 7000;
        const drop = (1 - Math.cos(progress * Math.PI * 2)) * 37.5;

        craneCable.setAttribute('y2', String(135 + drop));
        craneLoad.setAttribute('transform', `translate(0 ${drop})`);
        craneAnimationFrame = window.requestAnimationFrame(animateCrane);
      };
      const syncCraneMotion = () => {
        if (reducedMotionPreference.matches) {
          if (craneAnimationFrame !== null) {
            window.cancelAnimationFrame(craneAnimationFrame);
            craneAnimationFrame = null;
          }

          craneCable.setAttribute('y2', '135');
          craneLoad.removeAttribute('transform');
          craneAnimationStart = null;

          return;
        }

        if (craneAnimationFrame === null) {
          craneAnimationFrame = window.requestAnimationFrame(animateCrane);
        }
      };
      syncCraneMotion();
      reducedMotionPreference.addEventListener('change', syncCraneMotion);
      syncThemeChoice();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (event) => {
        try {
          const preference = JSON.parse(localStorage.getItem('idn-care-theme-settings') || '{}');
          if (preference.mode !== 'device') return;
          document.documentElement.dataset.theme = event.matches ? 'dark' : 'light';
          document.documentElement.style.colorScheme = event.matches ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', event.matches ? '#101a2a' : '#f2f6ff');
          syncThemeChoice();
        } catch {}
      });
      window.setInterval(() => {
        try {
          const preference = JSON.parse(localStorage.getItem('idn-care-theme-settings') || 'null');
          if (preference?.mode !== 'scheduled') return;
          const start = Number(preference.darkStart.slice(0, 2)) * 60 + Number(preference.darkStart.slice(3, 5));
          const end = Number(preference.lightStart.slice(0, 2)) * 60 + Number(preference.lightStart.slice(3, 5));
          const now = new Date();
          const current = now.getHours() * 60 + now.getMinutes();
          const dark = start === end || (start < end ? current >= start && current < end : current >= start || current < end);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#101a2a' : '#f2f6ff');
          syncThemeChoice();
        } catch {}
      }, 60_000);

    </script>
